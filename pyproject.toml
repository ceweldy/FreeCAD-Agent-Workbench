[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "freecad-agent-workbench"
version = "0.1.0"
description = "Open agent-native CAD workbench for FreeCAD"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Agent Workbench for FreeCAD contributors"}]
dependencies = []

[project.urls]
Documentation = "https://github.com/ceweldy/FreeCAD-Agent-Workbench/tree/main/docs"
Issues = "https://github.com/ceweldy/FreeCAD-Agent-Workbench/issues"
Repository = "https://github.com/ceweldy/FreeCAD-Agent-Workbench"

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["freecad.AgentCAD*"]
namespaces = true

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 96
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
